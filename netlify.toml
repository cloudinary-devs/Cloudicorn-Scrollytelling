[build]
  # Build command to run
  command = "npm run build"
  
  # Directory to publish (relative to root of your repo)
  publish = "."

[build.environment]
  # Set Node.js version
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirect rules for SPA (Single Page Application). Netlify invokes functions before these rewrites.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Static assets: always revalidate with the server before reusing a cached copy
# (fast 304 if unchanged, fresh copy immediately if changed — no more stale deploys).
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "no-cache"